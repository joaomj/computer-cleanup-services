// Opt-in mini-PC policy for the native Ubuntu unattended-upgrade scheduler.
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";

#clear Unattended-Upgrade::Allowed-Origins;
#clear Unattended-Upgrade::Origins-Pattern;
Unattended-Upgrade::Origins-Pattern {
    "origin=Ubuntu,archive=${distro_codename},codename=${distro_codename}";
    "origin=Ubuntu,archive=${distro_codename}-security,codename=${distro_codename}";
    "origin=Ubuntu,archive=${distro_codename}-updates,codename=${distro_codename}";
    "origin=UbuntuESMApps,archive=${distro_codename}-apps-security,codename=${distro_codename}";
    "origin=UbuntuESMApps,archive=${distro_codename}-apps-updates,codename=${distro_codename}";
    "origin=UbuntuESM,archive=${distro_codename}-infra-security,codename=${distro_codename}";
    "origin=UbuntuESM,archive=${distro_codename}-infra-updates,codename=${distro_codename}";
    "origin=gh,site=cli.github.com,codename=stable";
    "origin=Tailscale,site=pkgs.tailscale.com,codename=${distro_codename}";
};

Unattended-Upgrade::Automatic-Reboot "false";
Unattended-Upgrade::Remove-Unused-Dependencies "false";
Unattended-Upgrade::Remove-New-Unused-Dependencies "false";
