# Public macOS defaults. Copy these settings into the user environment file.
# Homebrew metadata refreshes daily; package upgrades run at most weekly.
# Journal limits do not apply because macOS has no systemd journal.
UV_CACHE_MAX_SIZE=1GiB
BRAVE_CACHE_MAX_SIZE=2GiB
NPM_CACHE_WARN_SIZE=1GiB
COMMAND_TIMEOUT_SECONDS=300
# Tool caches in projects are cleaned automatically after this age.
PROJECT_CACHE_MAX_AGE_HOURS=1
# High-risk items are offered only when the system is short of resources.
HIGH_RISK_REVIEW_DISK_PERCENT=85
HIGH_RISK_REVIEW_MEMORY_PERCENT=10
BREW_UPDATES_ENABLED=true
BREW_UPGRADE_MIN_AGE_DAYS=7

# Every cleanup action is on by default. Low-risk cleanup runs automatically;
# high-risk items wait for a recorded decision.
UV_CLEANUP_ENABLED=true
BRAVE_CLEANUP_ENABLED=true
NPM_CLEANUP_ENABLED=true
YARN_CLEANUP_ENABLED=true
PLAYWRIGHT_CLEANUP_ENABLED=true
ZED_CLEANUP_ENABLED=true
ZED_SERVER_CLEANUP_ENABLED=true
HUGGINGFACE_CLEANUP_ENABLED=true
PROJECT_ARTIFACTS_CLEANUP_ENABLED=true
DOCKER_PRUNE_ENABLED=true
TMP_CLEANUP_ENABLED=true
APT_CACHE_CLEANUP_ENABLED=true
JOURNAL_CLEANUP_ENABLED=true
BREW_CLEANUP_ENABLED=true
RUNTIME_UPDATES_ENABLED=false
